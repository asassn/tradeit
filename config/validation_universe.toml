# Phase 3 validation universe
#
# 85 instruments chosen to break things, not to make money. The objective is to
# stress the analytical infrastructure: every entry is here because it exercises
# a specific code path that a portfolio of large-cap survivors would never
# touch.
#
# `difficulty` names what the instrument tests. `note` says what actually
# happened. Anything without a real, checkable historical event is not in this
# file -- a synthetic "hard case" proves nothing.
#
# Delisted and acquired names are listed with the date they stopped trading.
# A provider that silently returns nothing for them, or worse returns the
# *current* holder of the ticker, fails this universe by construction. That is
# the intended test.

schema_version = 1
name = "phase3_validation"
description = "Heterogeneous stress universe for the Phase 3 acceptance gate"

