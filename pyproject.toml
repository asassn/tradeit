[project]
name = "tradeit"
version = "0.3.0"
description = "Quantitative stock screening, breakout confirmation, and portfolio compounding platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "structlog>=24.1",
    "python-dateutil>=2.9",
    "pandas-market-calendars>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
tradeit = "tradeit.cli:main"
# Data and validation commands without loading the platform settings, so the
# acquisition path works on a laptop with no database configured.
tradeit-data = "tradeit.cli_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not performance and not network'"
pythonpath = ["src"]
markers = [
    "integration: requires a live PostgreSQL database",
    "performance: throughput and memory benchmarks; excluded from the default run",
    "network: makes a real outbound connection; result depends on the machine's egress policy, not this repository",
]
filterwarnings = ["error::DeprecationWarning:tradeit.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "DTZ"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "DTZ001", "B017"]  # naive datetimes and blind raises are the assertions
"migrations/*" = ["ANN", "E501"]
"scripts/*" = ["ANN", "E402"]  # report generators: local paths set up before imports

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["tradeit"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas_market_calendars.*", "pandas.*"]
ignore_missing_imports = true
