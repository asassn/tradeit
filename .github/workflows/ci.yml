name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradeit
          POSTGRES_PASSWORD: tradeit
          POSTGRES_DB: tradeit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests migrations
          ruff format --check src tests

      - name: Type check
        run: mypy src/tradeit

      - name: Test
        env:
          TRADEIT_TEST_PG_DSN: postgresql+psycopg://tradeit:tradeit@localhost:5432/tradeit_test
        run: pytest -q --cov=tradeit --cov-report=term-missing
