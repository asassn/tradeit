# --------------------------------------------------------------------------
# Splits. The adjustment path is the single most common source of silent
# error in a price pipeline.
# --------------------------------------------------------------------------

[[instruments]]
ticker = "AAPL"
category = "split"
difficulty = "multiple_splits"
note = "7-for-1 in June 2014 and 4-for-1 in August 2020. Two splits of very different sizes in one series"

[[instruments]]
ticker = "TSLA"
category = "split"
difficulty = "multiple_splits"
note = "5-for-1 August 2020 and 3-for-1 August 2022, both during high-volatility periods where a mis-adjusted bar looks like a real move"

[[instruments]]
ticker = "NVDA"
category = "split"
difficulty = "large_split_ratio"
note = "4-for-1 July 2021 and 10-for-1 June 2024. A 10:1 makes an unadjusted series drop 90% overnight -- the exact shape of a catastrophe"

[[instruments]]
