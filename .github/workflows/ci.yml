name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The migration chain is exercised against every PostgreSQL major version a
    # developer is likely to have. A fresh `alembic upgrade head` broke on an
    # empty database and was reported from a Postgres.app 18 install; it
    # reproduced identically on 16, so the defect was never version-specific --
    # but "we only ever ran it on one major version" is exactly the gap that let
    # the question be asked at all.
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: tradeit
          POSTGRES_PASSWORD: tradeit
          POSTGRES_DB: tradeit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Must track requires-python in pyproject.toml. numpy declares
      # Requires-Python >=3.12, so `pip install -e ".[dev]"` fails outright on
      # 3.11 -- the job dies at Install before it can lint or test anything.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `ops` is in all three gates. It holds the unattended daily capture
      # agent, which is the one piece of Python nobody watches run -- and which
      # was a shell script until macOS TCC made it Python. Code that only runs at
      # 22:10 on somebody's laptop is exactly what must not drift unlinted.
      #
      # Note that `ruff format --check ops` also formats the code blocks inside
      # `ops/UNIVERSE.md`; ruff picks Markdown up from a directory argument.
      # That is a real gate and it passes, but it means a documentation edit
      # can fail the format job.
      - name: Lint
        run: |
          ruff check src tests migrations ops
          ruff format --check src tests ops

      - name: Type check
        run: mypy src/tradeit ops

      - name: Test
        env:
          TRADEIT_TEST_PG_DSN: postgresql+psycopg://tradeit:tradeit@localhost:5432/tradeit_test
        run: pytest -q --cov=tradeit --cov-report=term-missing
